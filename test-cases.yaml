base:
  name: Base Test Case
  description: "Rubeho community engagement by quarter, with synthetic mock-IO events (see mock-io/)."
  params:
    workflow_details:
      name: "Rubeho Community Engagement"
      description: ""
    er_client:
      data_source:
        name: "mep_dev"
    time_range:
      timezone:
        label: Africa/Dar_es_Salaam
        tzCode: EAT
        name: Dar es Salaam
        utc: +03:00
      since: "2025-01-01T00:00:00.000Z"
      until: "2025-12-31T23:59:59.000Z"
    groupers:
      groupers:
        - temporal_index: "__quarter__"
    events:
      event_types:
        - "community_meeting"
      event_states:
        - "resolved"
    event_radius:
      var: 5
    text_layer_size:
      var: 12
    choropleth_png:
      config:
        wait_for_timeout: 2000  # tests only: default 30s per map screenshot makes grouped cases very slow

by-village-and-type:
  name: Village and Meeting Type Groupers
  description: "Groups by village and meeting type, exercising the Rubeho groupers and the village choropleth."
  params:
    workflow_details:
      name: "Rubeho Community Engagement"
      description: ""
    er_client:
      data_source:
        name: "mep_dev"
    time_range:
      timezone:
        label: Africa/Dar_es_Salaam
        tzCode: EAT
        name: Dar es Salaam
        utc: +03:00
      since: "2025-01-01T00:00:00.000Z"
      until: "2025-12-31T23:59:59.000Z"
    groupers:
      groupers:
        - index_name: village
        - index_name: meeting_type
    events:
      event_types:
        - "community_meeting"
      event_states:
        - "resolved"
    event_radius:
      var: 5
    text_layer_size:
      var: 12
    choropleth_png:
      config:
        wait_for_timeout: 2000  # tests only: default 30s per map screenshot makes grouped cases very slow
